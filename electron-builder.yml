appId: io.github.eerohakanen.djvizz
productName: DJ Visualizer
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!node_modules/**/*"
  - "!**/.claude/**"
electronLanguages:
  - en
compression: maximum
win:
  target:
    - target: nsis
      arch: x64
  artifactName: DJ-Visualizer-windows.${ext}
nsis:
  oneClick: true
publish: null
